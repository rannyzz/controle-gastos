<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <link rel="stylesheet" href="css/home.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Gastos | Sistema de Gerenciamento Financeiro</title>
</head>
<body>
    <div id="container">
        <h1>Controle de Gastos</h1>
       <p id="desc">Organize seus gastos e tome decisões financeiras melhores.</p>
        <center>
                <h2>Seu Saldo</h2>
            <h3 id="saldo">Saldo: R$0,00</h3>
            </center>
        <div class="linha">
        <!-- ESQUERDA -->
        <div class="esquerda">
            <h3>Adicionar Gasto/Valor Recebido</h3>
            <div class="gasto">
                <input type="text" id="nome_gasto" placeholder="Digite o nome do gasto...">
                <input type="number" id="valor_gasto" placeholder="Digite o valor do gasto...">
                <button onclick="adicionarGasto()">Adicionar Gasto</button>
            </div>

            <div class="valor">
                <input type="number" id="valor_inserido" placeholder="Digite o valor a ser inserido...">
                <button onclick="adicionarValor()">Adicionar Valor</button>
            </div>
        </div>

        <!-- DIREITA -->
        <div class="direita">
            <h3>Gastos</h3>
            <p id="gastos"></p><br>
        </div>

    </div>
</div>
</body>
<script src="script/home.js"></script>
</html>
